trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  azureSubscription: '<azure-resource-manager-service-connection-name>'
  webAppName: '365-migration-tracker'

steps:
  - task: UseDotNet@2
    inputs:
      packageType: sdk
      version: '10.x'

  - task: DotNetCoreCLI@2
    displayName: Publish
    inputs:
      command: publish
      publishWebProjects: false
      projects: '365MigrationTracker.csproj'
      arguments: '-c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/publish'

  - task: AzureWebApp@1
    displayName: Deploy to App Service
    inputs:
      azureSubscription: $(azureSubscription)
      appType: webAppLinux
      appName: $(webAppName)
      package: '$(Build.ArtifactStagingDirectory)/publish'
